<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="container">
    <header class="header">
      <div class="icon-badge">📚</div>
      <h1>StudyMate AI</h1>
      <p class="subtitle">Learn smarter. Prepare better. ✨</p>
      <p class="description">Your personal AI study companion for understanding difficult topics and preparing for exams.</p>
    </header>

    <section class="card">
      <label for="topicInput" class="card-title">🎓 What do you want to learn?</label>
      <textarea id="topicInput" placeholder="e.g., Binary Search, Quantum Physics, Photosynthesis..."></textarea>
      
      <div class="button-group">
        <button id="guideBtn" class="btn btn-primary">Generate Study Guide 🚀</button>
        <button id="quizBtn" class="btn btn-secondary">🧠 Test My Knowledge</button>
      </div>
    </section>

    <section id="outputCard" class="card hidden">
      <div id="outputContent"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
